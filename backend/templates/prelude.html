<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Prelude - Mission Impossible</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <style>
    html, body { height: 100%; }
    body.room-prelude { background: #000; color: #eaf2ff; }
    .prelude-wrap {
      max-width: 1100px;
      margin: 28px auto;
      padding: 16px;
      color: #eaf2ff;
      text-shadow: 0 2px 8px rgba(0,0,0,.6);
    }
    .scene-container {
      position: relative;
      display: inline-block;
      user-select: none;
    }
    #scene-img {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 14px 40px rgba(0,0,0,.45);
    }
    #overlay-canvas {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: auto;
      z-index: 5;
    }
    #info { margin-top: 10px; font-size: 1.05rem; }
    #status.loader { font-weight: 700; }
    #hint { margin-left: 8px; opacity: .9; }
    .hud {
      margin-top: 14px;
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
      background: linear-gradient(180deg,rgba(8,18,28,.55),rgba(8,18,28,.35));
      border: 1px solid rgba(140,200,255,.18);
      backdrop-filter: blur(6px);
      border-radius: 12px;
      padding: 10px 12px;
      color: #dff2ff;
    }
    #system-working {
      display: none;
      max-width: 360px;
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 12px 36px rgba(0,0,0,.45);
    }
    #system-working.pulse { animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse {
      0% { opacity: .85 }
      50% { opacity: 1 }
      100% { opacity: .85 }
    }
    #corridor-reveal {
      display: none;
      margin-top: 14px;
      max-width: 760px;
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0,0,0,.6);
    }
    #next-room-btn {
      display: none;
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      background: #0b2433;
      color: #eaf6ff;
      border: 1px solid rgba(94,198,255,.18);
    }
  </style>

  <!-- Load face-api.js before our script -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js" crossorigin="anonymous"></script>

  <!-- Inject model path into JS -->
  <script>
    window.FACE_MODELS = "{{ url_for('static', filename='models') }}";
  </script>

  <script defer src="{{ url_for('static', filename='js/prelude.js') }}"></script>
</head>
<body class="room-prelude">
  <div class="prelude-wrap">
    <h1>Prelude - Infiltrate the Kremlin</h1>
    <p>Agent <strong>{{ session.get('player_name', 'Agent') }}</strong>.
      Click directly on the guard’s <strong>right eye</strong> and then the <strong>left eye</strong>. The AI will validate your clicks.</p>

    <div class="scene-container" id="scene-container">
      <img id="scene-img" src="{{ url_for('static', filename='images/guard_eyes2.jpg') }}" alt="Guard - front desk">
      <canvas id="overlay-canvas"></canvas>
    </div>

    <div id="info">
      <span id="status" class="loader">Loading…</span>
      <span id="hint" style="display:none;">Pick two points on the guard’s eyes (right then left).</span>
    </div>

    <div class="hud">
      <img id="system-working" src="{{ url_for('static', filename='images/guard_scence.jpg') }}" alt="Projection rig at work">
      <div>System status: <strong id="sys-status">Idle</strong></div>
    </div>

    <img id="corridor-reveal" src="{{ url_for('static', filename='images/corridor_reveal.jpg') }}" alt="Corridor revealed">



    <div>
  <a href="/room/1" id="next-room-btn" class="btn-next">Proceed to Room 1 »</a>
</div>
  </div>
</body>
</html>
