<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mission Summary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <style>
    body.summary-page {
      background: #000;
      color: #eaf6ff;
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", Verdana, sans-serif;
      line-height: 1.6;
    }

    .summary-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    .summary-wrap h1,
    .summary-wrap h2 {
      color: #ffffff;
      margin-bottom: 16px;
    }

    .hero {
      margin: 22px 0 28px;
    }

    .hero img {
      display: block;
      width: 100%;
      max-width: 900px;
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0,0,0,.45);
    }

    .hero .text {
      margin-top: 16px;
      color: #4ddf6a;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .summary-table {
      width: 100%;
      max-width: 760px;
      border-collapse: collapse;
      margin-top: 14px;
      background: rgba(12, 25, 36, 0.88);
      border: 1px solid rgba(94,198,255,.18);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
    }

    .summary-table thead tr {
      background: rgba(255,255,255,.06);
    }

    .summary-table th,
    .summary-table td {
      padding: 12px 14px;
      text-align: left;
      color: #eaf6ff;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .summary-table th {
      color: #ffffff;
      font-weight: 700;
    }

    .summary-table tbody tr:last-child td {
      border-bottom: none;
    }

    .btn-summary {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 16px;
      border-radius: 10px;
      background: #0f2330;
      color: #eaf6ff;
      text-decoration: none;
      border: 1px solid #2b3f50;
      box-shadow: 0 6px 16px rgba(0,0,0,.25);
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }

    .btn-summary:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(0,0,0,.30);
      background: #152c3a;
    }
  </style>
</head>

<body class="summary-page">
  <div class="summary-wrap">
    <h1>Mission Summary</h1>

    {% if finished %}
    <div class="hero">
      <img src="{{ url_for('static', filename='images/for_final.jpg') }}" alt="Tom Cruise found the key">
      <div class="text">
        You stopped the Entity! Well done Agent.
      </div>
    </div>
    {% endif %}

    <h2>Your performance</h2>

    <table class="summary-table">
      <thead>
        <tr>
          <th>Room</th>
          <th>Status</th>
          <th>Attempts</th>
          <th>Time (sec)</th>
        </tr>
      </thead>
      <tbody>
        {% for i in items %}
        <tr>
          <td>{{ i.room }}</td>
          <td>{{ i.status }}</td>
          <td>{{ i.attempts }}</td>
          <td>{{ '%.1f' % i.seconds if i.seconds else '-' }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    <a class="btn-summary" href="{{ url_for('home') }}">Play again</a>
  </div>
</body>
</html>
